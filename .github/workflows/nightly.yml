# Full parity on the other vendors and the older versions Directus tests (T098, R19).
# The nightly schedule is off until every feature is built: the startup tests do not support these vendors yet
# (host DB settings, plan.md Complexity Tracking). Run it by hand with workflow_dispatch meanwhile.
# To turn it back on, add:  schedule: [{ cron: '0 18 * * *' }]  (01:00 Asia/Ho_Chi_Minh)
name: Nightly

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  PARITY_SUITE: full
  # Feature 007: files and assets on both storages.
  PARITY_STORAGES: local,s3

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # mysql5 left out (feature 006, nightly run 38241348869): Directus 11.17.4 does not start on mysql:5, its
        # migration 20240716A fails with ER_INVALID_DEFAULT on `uploaded_on timestamp`.
        vendor: [maria, mssql, oracle, cockroachdb, postgres10, mysql, sqlite3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run api:build
      - run:
          pnpm nx run parity-tests:env-up --vendor=${{ matrix.vendor }}
          --profiles=ratelimit,cors-hsts,pressure,metrics,sso,assets-limit,assets-stress
      - run: pnpm nx run parity-tests:parity --vendor=${{ matrix.vendor }} --output-style=static
      - name: container logs
        if: failure()
        working-directory: tests/parity
        run: docker compose -p parity-${{ matrix.vendor }} logs --no-color > parity-${{ matrix.vendor }}.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightly-parity-${{ matrix.vendor }}-logs
          path: tests/parity/parity-${{ matrix.vendor }}.log
      - if: always()
        run: pnpm nx run parity-tests:env-down --vendor=${{ matrix.vendor }}
