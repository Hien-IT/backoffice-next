# Benchmarks against Directus 11.17.4 (FR-113 of spec 001, SC-007 of spec 003), out of CI since 2026-10-11: about
# 75 minutes of runners per run, too many for the Actions minutes of the private repo on every push (owner's choice,
# plan.md Complexity Tracking of spec 003). Weekly, and by hand with workflow_dispatch before a release.
name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0' # Monday 02:00 Asia/Ho_Chi_Minh

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run benchmark:env-up
      # 5 rounds instead of 3: the shared runner varies more than the 10% tolerance between runs.
      - run: pnpm nx run benchmark:run --output-style=static
        env:
          BENCH_ROUNDS: 5
      # A container that exits during env-up leaves no trace in the job otherwise (2026-10-13: Directus exit 1).
      - name: container logs
        if: failure()
        run: |
          docker logs --tail 200 benchmark-directus-1 2>&1 | grep -v '"level":30' | tail -100
          docker logs --tail 200 benchmark-backoffice-api-1 2>&1 | grep -v '"level":30' | tail -100
      - if: always()
        run: pnpm nx run benchmark:env-down

  # Feature 003 (SC-007, research R12): auth routes with 2,000 connections, beside `benchmark`.
  benchmark-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Pressure limiter off for both apps, 3 rounds: owner's choice for SC-007 (tasks.md T066, spec 003).
      - run: pnpm nx run benchmark:env-up-auth
      # stream: the progress lines show while a round runs (static holds them until the task ends).
      - run: pnpm nx run benchmark:auth --output-style=stream
        env:
          BENCH_ROUNDS: 3
      - name: container state and logs
        if: failure()
        run: |
          docker inspect -f '{{.Name}} {{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' $(docker ps -aq)
          docker logs benchmark-directus-1 2>&1 | grep -iE 'pm2|exited|heap|sigkill|sigterm|out of memory' | tail -50
          docker logs --tail 300 benchmark-directus-1 2>&1 | grep -v '"level":30' | tail -100
          docker logs --tail 300 benchmark-backoffice-api-1 2>&1 | grep -v '"level":30' | tail -100
      - if: always()
        run: pnpm nx run benchmark:env-down

  # Feature 004 (SC-006, research R14): permission-heavy reads with 2,000 users, three policies each, beside the others.
  benchmark-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run benchmark:env-up
      - run: pnpm nx run benchmark:permissions --output-style=static
        env:
          BENCH_ROUNDS: 5
      # A container that exits during env-up leaves no trace in the job otherwise (2026-10-13: Directus exit 1).
      - name: container logs
        if: failure()
        run: |
          docker logs --tail 200 benchmark-directus-1 2>&1 | grep -v '"level":30' | tail -100
          docker logs --tail 200 benchmark-backoffice-api-1 2>&1 | grep -v '"level":30' | tail -100
      - if: always()
        run: pnpm nx run benchmark:env-down

  # Feature 005 (FR-048, research R11): /items on 10 million rows, fresh and from the shared response cache, beside the
  # others. The seed loads the rows with generate_series in a few minutes.
  benchmark-items:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run benchmark:env-up
      - run: df -h /
      - run: pnpm nx run benchmark:items --output-style=static
        env:
          BENCH_ROUNDS: 3
      - if: always()
        run: df -h /
      # A container that exits during env-up leaves no trace in the job otherwise (2026-10-13: Directus exit 1).
      - name: container logs
        if: failure()
        run: |
          docker logs --tail 200 benchmark-directus-1 2>&1 | grep -v '"level":30' | tail -100
          docker logs --tail 200 benchmark-backoffice-api-1 2>&1 | grep -v '"level":30' | tail -100
      - if: always()
        run: pnpm nx run benchmark:env-down

  # Feature 006 (FR-065, SC-007, research R10): the data model reads the Directus app makes at start, snapshot and diff,
  # on about 200 collections, 3,000 fields and 300 relations seeded through the Directus API.
  benchmark-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run benchmark:env-up
      # 5 rounds like the main job: at about 10 req/s (GET /fields without cache) or 1 MB per request a round on a
      # shared runner moves more than the 10% tolerance (run 38383218274, 2026-10-13).
      - run: pnpm nx run benchmark:schema --output-style=static
        env:
          BENCH_ROUNDS: 5
      # A container that exits during env-up leaves no trace in the job otherwise (2026-10-13: Directus exit 1).
      - name: container logs
        if: failure()
        run: |
          docker logs --tail 200 benchmark-directus-1 2>&1 | grep -v '"level":30' | tail -100
          docker logs --tail 200 benchmark-backoffice-api-1 2>&1 | grep -v '"level":30' | tail -100
      - if: always()
        run: pnpm nx run benchmark:env-down

  # Feature 007 (contracts/parity.md §6): originals, derived and new transformations of /assets, /files list and uploads.
  benchmark-files:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run benchmark:env-up
      # 5 rounds like the main job: at about 10 req/s (GET /fields without cache) or 1 MB per request a round on a
      # shared runner moves more than the 10% tolerance (run 38383218274, 2026-10-13).
      - run: pnpm nx run benchmark:files --output-style=static
        env:
          BENCH_ROUNDS: 5
      # A container that exits during env-up leaves no trace in the job otherwise (2026-10-13: Directus exit 1).
      - name: container logs
        if: failure()
        run: |
          docker logs --tail 200 benchmark-directus-1 2>&1 | grep -v '"level":30' | tail -100
          docker logs --tail 200 benchmark-backoffice-api-1 2>&1 | grep -v '"level":30' | tail -100
      - if: always()
        run: pnpm nx run benchmark:env-down

  benchmark-history:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run benchmark:env-up
      - run: pnpm nx run benchmark:history --output-style=static
        env:
          BENCH_ROUNDS: 3
      # A container that exits during env-up leaves no trace in the job otherwise (2026-10-13: Directus exit 1).
      - name: container logs
        if: failure()
        run: |
          docker logs --tail 200 benchmark-directus-1 2>&1 | grep -v '"level":30' | tail -100
          docker logs --tail 200 benchmark-backoffice-api-1 2>&1 | grep -v '"level":30' | tail -100
      - if: always()
        run: pnpm nx run benchmark:env-down
