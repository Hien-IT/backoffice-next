# Quality gates of Principle X (T097, R19). Runs on pull requests and on every push to main. The project merges
# straight into main and fixes a red job in the next commit (SC-007; no branch protection on this plan, see
# tests/parity/README.md). The benchmarks run in benchmark.yml (weekly and by hand): owner's choice to save Actions
# minutes on the private repo (2026-10-11, plan.md Complexity Tracking of spec 003).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push cancels the running run of the same ref, on main too (owner, 2026-10-17): its result is out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'

jobs:
  guard-directus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: directus/ is unchanged (FR-111)
        run:
          node tools/guard-directus-unchanged.mjs ${{ github.event_name == 'pull_request' && format('origin/{0}',
          github.base_ref) || github.event.before }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # apps/web runs *.browser.test.ts in headless chromium (feature 013, research R8)
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: lint, typecheck, test (coverage gates), build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm nx affected -t lint typecheck test build check-bundle --base=origin/${{ github.base_ref }} --head=HEAD
          else
            # web:test last and alone: run in parallel with the other targets, its browser tests starve on the runner
            # and time out (runs 38956968191, 38963274762, 38969565336).
            pnpm nx run-many -t lint typecheck test build check-bundle --exclude=web
            pnpm nx run-many -t lint typecheck build check-bundle --projects=web
            pnpm nx run web:test
          fi
      - name: web perf (SC-004 of 013, SC-011 of 014 table and tree, SC-007 of 015 to 018, alone, without coverage)
        working-directory: apps/web
        run: >-
          PERF=1 pnpm exec vitest run --project browser --coverage.enabled=false
          src/components/form/perf.browser.test.ts src/layouts/tabular/perf.browser.test.ts
          src/modules/content/components/perf.browser.test.ts src/modules/files/perf.browser.test.ts
          src/modules/users/perf.browser.test.ts src/components/files/perf.browser.test.ts
          src/modules/settings/perf.browser.test.ts src/modules/settings/routes/flows/perf.browser.test.ts
          src/modules/insights/perf.browser.test.ts
      - run: pnpm run test:tools
      - run: pnpm run check-port-headers
      - run: pnpm run check-package-names
      - name: OpenAPI contracts are valid
        run: |
          for f in specs/*/contracts/*.openapi.yaml; do
            pnpm --filter @backoffice/specs exec swagger-cli validate "$GITHUB_WORKSPACE/$f"
          done

  guard-differences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: accepted differences match the specs and none has expired (FR-101)
        run: pnpm --filter @backoffice/parity-tests exec vitest run src/accepted-differences.test.ts

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `full` on Postgres in two shards (about 12 minutes of tests in one job), each with its own environment.
          # Feature 007 (spec Clarifications): Postgres runs the files and assets tests on `local` and MinIO, MySQL and
          # SQLite on MinIO only; the assets-limit and assets-stress pairs serve the narrower files configuration.
          - {
              vendor: postgres,
              suite: full,
              shard: 1,
              profiles: 'ratelimit,cors-hsts,pressure,metrics,multi,cache-config,sso,user-limits,assets-limit,assets-stress,setup,graphql-nointro,extensions,bootstrap',
              storages: 'local,s3',
            }
          - {
              vendor: postgres,
              suite: full,
              shard: 2,
              profiles: 'ratelimit,cors-hsts,pressure,metrics,multi,cache-config,sso,user-limits,assets-limit,assets-stress,setup,graphql-nointro,extensions,bootstrap',
              storages: 'local,s3',
            }
          # Feature 005 (spec FR-041): the reduced blackbox port (integer keys) runs on the blackbox pair after `reduced`.
          - {
              vendor: mysql,
              suite: reduced,
              profiles: 'blackbox,assets-limit,assets-stress,cache-mem',
              blackbox: integer,
              storages: s3,
            }
          # Spec 021: profile bootstrap (two empty databases, one per app) on Postgres (full) and SQLite (reduced).
          - {
              vendor: sqlite3,
              suite: reduced,
              profiles: 'blackbox,assets-limit,assets-stress,cache-mem,bootstrap',
              blackbox: integer,
              storages: s3,
            }
    env:
      PARITY_SUITE: ${{ matrix.suite }}
      PARITY_SHARD: ${{ matrix.shard && format('{0}/2', matrix.shard) || '' }}
      PARITY_STORAGES: ${{ matrix.storages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Startup scenarios and the read-only account run the built API on the host.
      - run: pnpm nx run api:build
      - run: pnpm nx run parity-tests:env-up --vendor=${{ matrix.vendor }} --profiles=${{ matrix.profiles }}
      - run: pnpm nx run parity-tests:parity --vendor=${{ matrix.vendor }} --output-style=static
      - if: matrix.blackbox
        run: pnpm nx run parity-tests:parity-blackbox --vendor=${{ matrix.vendor }} --output-style=static
        env:
          PARITY_BLACKBOX_PK_TYPES: ${{ matrix.blackbox }}
      - name: container logs
        if: failure()
        working-directory: tests/parity
        run: docker compose -p parity-${{ matrix.vendor }} logs --no-color > parity-${{ matrix.vendor }}.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-${{ matrix.vendor }}${{ matrix.shard && format('-shard{0}', matrix.shard) || '' }}-logs
          path: tests/parity/parity-${{ matrix.vendor }}.log
      - if: always()
        run: pnpm nx run parity-tests:env-down --vendor=${{ matrix.vendor }}

  # Feature 005 (spec FR-040, FR-041, research R6): the port of the Directus blackbox items, query and relational files,
  # every key type, once at the new app then once at Directus, on the blackbox pair (env of directus/tests/blackbox).
  # One job per app run, every key type each (about 6 minutes of tests instead of 13 in one job). Not split by key type:
  # the uuid and string blocks of the Directus tests also read the integer collections.
  parity-blackbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [backoffice, directus]
    env:
      PARITY_BLACKBOX_APPS: ${{ matrix.app }}
      # Feature 007: the files and assets files of the port on both storages.
      PARITY_STORAGES: local,s3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Feature 006 (research R7): the nodes of schema-cache.test.ts and of the two timezone files are profile pairs.
      - run:
          pnpm nx run parity-tests:env-up --vendor=postgres
          --profiles=blackbox,schema-cache,schema-cache-nomsg,tz-asia,tz-america,assets-limit,assets-stress,cache-mem
      - run: pnpm nx run parity-tests:parity-blackbox --vendor=postgres --output-style=static
      - name: container logs
        if: failure()
        working-directory: tests/parity
        run: docker compose -p parity-postgres logs --no-color > parity-blackbox.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-blackbox-${{ matrix.app }}-logs
          path: tests/parity/parity-blackbox.log
      - if: always()
        run: pnpm nx run parity-tests:env-down --vendor=postgres

  # Feature 005 (spec FR-042, research R5): the response cache shared with Directus on the four cache pairs (memory,
  # memory with purge, Redis, Redis with purge) and the WebSocket pair: the port of the Directus cache blackbox tests,
  # the cases across apps, Redis down and the websocket.event bus.
  parity-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run:
          pnpm nx run parity-tests:env-up --vendor=postgres
          --profiles=cache-mem,cache-mem-purge,cache-redis,cache-redis-purge,websocket
      - run: pnpm nx run parity-tests:parity-cache --vendor=postgres --output-style=static
      - name: container logs
        if: failure()
        working-directory: tests/parity
        run: docker compose -p parity-postgres logs --no-color > parity-cache.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-cache-logs
          path: tests/parity/parity-cache.log
      - if: always()
        run: pnpm nx run parity-tests:env-down --vendor=postgres

  # Feature 004 (SC-001): one shard of the full permission matrix per push, rotating with the run number; the whole
  # matrix runs in parity-matrix.yml (weekly and by hand). n = 4 shards of about 6 minutes (tasks.md, T058).
  parity-matrix-rotating:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PARITY_SUITE: matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run api:build
      - run: pnpm nx run parity-tests:env-up --vendor=postgres
      - name: shard of this run
        run: echo "PARITY_MATRIX_SHARD=$(( ${{ github.run_number }} % 4 + 1 ))/4" >> "$GITHUB_ENV"
      - run: pnpm nx run parity-tests:parity-matrix --vendor=postgres --output-style=static
      - name: container logs
        if: failure()
        working-directory: tests/parity
        run: docker compose -p parity-postgres logs --no-color > parity-matrix.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-matrix-logs
          path: tests/parity/parity-matrix.log
      - if: always()
        run: pnpm nx run parity-tests:env-down --vendor=postgres

  # Feature 004 (FR-106, SC-008): the Directus app 11.17.4 through the reverse proxy (routes of 001 to 004 to the new
  # app), driven by Playwright; the rows of each scenario are compared with a run at Directus alone.
  e2e-directus-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run api:build
      - run: pnpm nx run parity-tests:env-up --vendor=postgres --profiles=app,setup
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: tests/directus-app-e2e
      - run: pnpm nx run directus-app-e2e:e2e --output-style=static
        env:
          BASE_URL: http://127.0.0.1:8160
          CI: 'true'
      - name: container logs
        if: failure()
        working-directory: tests/parity
        run: docker compose -p parity-postgres logs --no-color > e2e-directus-app.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-directus-app
          path: |
            tests/parity/e2e-directus-app.log
            tests/directus-app-e2e/test-results
      - if: always()
        run: pnpm nx run parity-tests:env-down --vendor=postgres

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Feature 019 (T110, research R13): both images through @nx-tools/nx-container (docker buildx, linux/amd64), with
      # the Backoffice version and the commit as OCI labels; INPUT_<PROJECT>_* replace the tags and build args of the
      # `container` targets.
      - name: build the API and web images
        run: |
          args=$(printf 'BACKOFFICE_VERSION=%s\nVCS_REF=%s' "$(node -p "require('./apps/api/package.json').version")" "$GITHUB_SHA")
          INPUT_API_TAGS=hiennd23/backoffice-api:ci INPUT_API_BUILD_ARGS="$args" pnpm nx run api:container --output-style=static
          INPUT_WEB_TAGS=hiennd23/backoffice-web:ci INPUT_WEB_BUILD_ARGS="$args" pnpm nx run web:container --output-style=static
      - name: both images carry the commit
        run: |
          for app in api web; do
            test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "hiennd23/backoffice-$app:ci")" = "$GITHUB_SHA"
          done
      # Feature 009: the native isolated-vm addon (Run Script operation) loads in the runtime image.
      - run: docker run --rm hiennd23/backoffice-api:ci node -e "require('isolated-vm')"
      # Spec 021 (FR-040, FR-061): the CLI entry and the 15 seed files are in the image.
      - name: the image has the CLI and the seeds
        run: |
          docker run --rm hiennd23/backoffice-api:ci node cli.js --version
          test "$(docker run --rm hiennd23/backoffice-api:ci sh -c 'ls dist/database/seeds/*.yaml | wc -l')" -eq 15
      - run: docker save hiennd23/backoffice-api:ci hiennd23/backoffice-web:ci | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 1

  # Feature 012 (T067, contracts/e2e.md §4): the web app E2E in the three configurations of the parity profile `web`
  # (proxy to Directus, proxy to the new API, cross-site), chromium, firefox and webkit at 768 and 1280 px (cross-site:
  # chromium 1280), with the images of the `docker` job.
  e2e-web:
    needs: docker
    runs-on: ubuntu-latest
    # Feature 014 (T093): the Content specs run in the three configurations (firefox and webkit run the @core ones only);
    # the payload and content-parity-ui specs run in proxy-api only. Feature 015: one job per configuration, as the three
    # in a row passed 100 minutes (proxy-directus alone took 46 minutes on run 38850422711). Feature 016: proxy-directus
    # and proxy-api in two shards each (50 and 57 minutes on run 38934146076); each shard has its own env and seed.
    # Spec 020 (owner 2026-10-22): proxy-api in four shards and proxy-directus in three (74 and 41 minutes with two on
    # run 39629189282, env setup about 3 minutes per shard), so the run is no longer bound by one 70-minute shard.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: proxy-directus, shard: 1/3 }
          - { config: proxy-directus, shard: 2/3 }
          - { config: proxy-directus, shard: 3/3 }
          - { config: proxy-api, shard: 1/4 }
          - { config: proxy-api, shard: 2/4 }
          - { config: proxy-api, shard: 3/4 }
          - { config: proxy-api, shard: 4/4 }
          - { config: cors, shard: 1/1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: images
      - name: load the API and web images as the local tags of the parity compose file
        run: |
          gunzip -c images.tar.gz | docker load
          docker tag hiennd23/backoffice-api:ci hiennd23/backoffice-api:local
          docker tag hiennd23/backoffice-web:ci hiennd23/backoffice-web:local
      - run: pnpm nx run parity-tests:env-up --vendor=postgres --profiles=app,setup,sso,web
        env:
          PARITY_NO_BUILD: '1'
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        working-directory: apps/web-e2e
      # Feature 014: the Content specs use the fixture set bo_* (apps/web/fixtures/interfaces), seeded through Directus
      # on the shared database with the admin of the parity env file.
      - name: seed the fixture set bo_*
        run: |
          set -a; . tests/parity/env/postgres.env; set +a
          node apps/web/fixtures/interfaces/seed.mjs --api http://127.0.0.1:8155 --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD"
          # The APIs of the other pairs (8156 shares the bus with Directus; 8163 of the cors configuration has its own
          # namespaces) built their schema cache before the seed: clear it (system included) so they see bo_*.
          for api in http://127.0.0.1:8156 http://127.0.0.1:8163; do
            token=$(curl -sf -X POST "$api/auth/login" -H 'content-type: application/json' \
              -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" | node -e 'process.stdin.on("data", (d) => process.stdout.write(JSON.parse(d).data.access_token))')
            curl -sf -X POST "$api/utils/cache/clear?system" -H "authorization: Bearer $token"
          done
      - name: E2E (${{ matrix.config }}, shard ${{ matrix.shard }})
        run: pnpm exec playwright test --shard=${{ matrix.shard }}
        working-directory: apps/web-e2e
        env:
          E2E_CONFIG: ${{ matrix.config }}
          CI: 'true'
      - name: container logs
        if: failure()
        working-directory: tests/parity
        run: docker compose -p parity-postgres logs --no-color > e2e-web.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-web-${{ matrix.config }}-${{ strategy.job-index }}
          path: |
            tests/parity/e2e-web.log
            apps/web-e2e/test-results
      - if: always()
        run: pnpm nx run parity-tests:env-down --vendor=postgres

  # Feature 019 (T111, contracts/tests.md): the acceptance suite on deploy/compose with 3 BE replicas + 1 Directus, then
  # the separate-domain mode, with the images of the `docker` job.
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BACKOFFICE_TAG: ci
      DEPLOY_KEEP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: images
      - run: gunzip -c images.tar.gz | docker load
      - run: pnpm nx run parity-tests:deploy --output-style=static
      - run: pnpm nx run parity-tests:deploy --output-style=static
        env:
          DEPLOY_MODE: separate-domain
      - name: container logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose -p bo-deploy --env-file .env.deploy-test logs --no-color > deploy.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deploy-logs
          path: deploy/compose/deploy.log
      - if: always()
        working-directory: deploy/compose
        run: docker compose -p bo-deploy --env-file .env.deploy-test down -v --remove-orphans || true

  # Feature 019 (T112, FR-049): the Helm chart: lint, kubeconform on Kubernetes 1.29 and the template checks, then an
  # install on kind next to a Directus deployment (ci/deps.yaml): routing, rolling update and HPA scaling under load, the
  # install-time checks. Tool versions: research.md "Kết quả T001".
  deploy-k8s:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: images
      - run: gunzip -c images.tar.gz | docker load
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0
      - name: kubeconform v0.8.0
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          curl -sSfLO https://github.com/yannh/kubeconform/releases/download/v0.8.0/CHECKSUMS
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: deploy/helm/backoffice/ci/test-template.sh
      - uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          cluster_name: bo-deploy
      - run: deploy/helm/backoffice/ci/kind-test.sh
        env:
          KIND_CLUSTER: bo-deploy
      - name: cluster state
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl describe pods
          for p in $(kubectl get pods -o name); do echo "== $p"; kubectl logs "$p" --all-containers --tail=200 || true; done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm audit --prod --audit-level=high
      - name: gitleaks
        run:
          docker run --rm -w /repo -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 dir . --config .gitleaks.toml
          --redact --no-banner

  # Pushes the images tested above to Docker Hub after a merge into main, only when every gate passed.
  # Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Docker Hub access token, Read & Write).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        guard-directus,
        quality,
        guard-differences,
        parity,
        parity-blackbox,
        parity-cache,
        parity-matrix-rotating,
        e2e-directus-app,
        docker,
        e2e-web,
        deploy,
        deploy-k8s,
        security,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: images
      - run: gunzip -c images.tar.gz | docker load
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: tag latest and the commit SHA, then push
        run: |
          for app in api web; do
            for tag in latest "$GITHUB_SHA"; do
              docker tag "hiennd23/backoffice-$app:ci" "hiennd23/backoffice-$app:$tag"
              docker push "hiennd23/backoffice-$app:$tag"
            done
          done
