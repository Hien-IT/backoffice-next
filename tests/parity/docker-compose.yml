# Parity environment: one database vendor (profile), Redis, MinIO, Directus 11.17.4 and Backoffice.
# Both apps read the same env file (tests/parity/env/<vendor>.env), which proves SC-001.
#
#   pnpm nx run parity-tests:env-up --vendor=postgres
#   pnpm nx run parity-tests:env-down --vendor=postgres
#
# Host ports follow directus/tests/blackbox: DB 6100+, Redis 6108, MinIO 8881. Apps: Directus 8155, Backoffice 8156.
#
# Profiles ratelimit, cors-hsts, pressure (and metrics, US5) each add ONE MORE PAIR of containers (Directus +
# Backoffice) with the vendor env file plus env/profile-<name>.env, on their own ports and CACHE_NAMESPACE. The main
# pair never changes, so several profiles can run at once. Pairs start after the main Directus has bootstrapped.

x-app: &app
  env_file:
    - ./env/${TEST_DB:-postgres}.env
    # Spec 020: the benchmark sets PARITY_EXTENSIONS_ENV=no-extensions (SC-005: measured without extensions).
    - ./env/${PARITY_EXTENSIONS_ENV:-extensions}.env
  # SQLite: both apps open the same database file (ignored by the other vendors). Feature 007: every app container
  # mounts the same `uploads` volume, the root of the `local` storage location (shared storage, Principle VII).
  volumes:
    - ./.data/sqlite:/directus/database/sqlite
    - uploads:/directus/uploads
  depends_on:
    postgres: { condition: service_healthy, required: false }
    postgres10: { condition: service_healthy, required: false }
    mysql: { condition: service_healthy, required: false }
    mysql5: { condition: service_healthy, required: false }
    maria: { condition: service_healthy, required: false }
    mssql: { condition: service_healthy, required: false }
    oracle: { condition: service_healthy, required: false }
    cockroachdb: { condition: service_healthy, required: false }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }
    files-fixtures: { condition: service_healthy }
    registry: { condition: service_healthy }

services:
  postgres:
    profiles: [postgres]
    image: postgis/postgis:13-3.4-alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: directus
    ports:
      - '6100:5432'
    healthcheck:
      # Over TCP: the init server of the image (initdb, then the postgis scripts) listens on the socket only, so a socket
      # check passes before the real server starts and Directus then meets ECONNREFUSED on 5432 (CI 2026-10-13).
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d directus']
      interval: 2s
      timeout: 5s
      retries: 60

  postgres10:
    profiles: [postgres10]
    image: postgis/postgis:10-3.2-alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: directus
    ports:
      - '6101:5432'
    healthcheck:
      # Over TCP: the init server of the image (initdb, then the postgis scripts) listens on the socket only, so a socket
      # check passes before the real server starts and Directus then meets ECONNREFUSED on 5432 (CI 2026-10-13).
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d directus']
      interval: 2s
      timeout: 5s
      retries: 60

  mysql:
    profiles: [mysql]
    image: mysql:8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: directus
    ports:
      - '6102:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -psecret --silent']
      interval: 3s
      timeout: 5s
      retries: 100

  mysql5:
    profiles: [mysql5]
    image: mysql:5
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: directus
    ports:
      - '6103:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -psecret --silent']
      interval: 3s
      timeout: 5s
      retries: 100

  maria:
    profiles: [maria]
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: directus
    ports:
      - '6104:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      timeout: 5s
      retries: 100

  mssql:
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Test@123
      MSSQL_PID: Express
    ports:
      - '6105:1433'
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Test@123 -Q "select 1" || exit 1']
      interval: 5s
      timeout: 10s
      retries: 60

  # Blackbox uses the unmaintained Oracle 18 image; CI uses Oracle XE 21 slim (spec Assumptions).
  oracle:
    profiles: [oracle]
    image: gvenzl/oracle-xe:21-slim-faststart
    environment:
      ORACLE_PASSWORD: secretpassword
      APP_USER: secretsysuser
      APP_USER_PASSWORD: secretpassword
    ports:
      - '6106:1521'
    shm_size: '1gb'
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 10s
      timeout: 10s
      retries: 60

  cockroachdb:
    profiles: [cockroachdb]
    image: cockroachdb/cockroach:latest-v24.3
    command: start-single-node --cluster-name=example-single-node --insecure --store=type=mem,size=4GB
    ports:
      - '6107:26257'
    healthcheck:
      test: ['CMD', 'cockroach', 'sql', '--insecure', '-e', 'select 1']
      interval: 3s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    # The container keeps running (so the name `redis` stays in Docker DNS) while redisDown() stops only the server:
    # a stopped container drops out of DNS and clients wait on DNS timeouts (EAI_AGAIN), slow and uneven on CI.
    command: ['sh', '-c', 'while :; do [ -f /tmp/down ] || redis-server --save "" --appendonly no; sleep 0.2; done']
    stop_grace_period: 1s
    ports:
      - '6108:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 60

  # Feature 010 (research R12): the test extensions registry. Every env/<vendor>.env sets MARKETPLACE_REGISTRY to it, so
  # the registry browse routes of /extensions answer the same fixed data at both apps without the real registry.
  registry:
    image: node:22-alpine
    command: ['node', '/registry/server.mjs']
    volumes:
      - ./registry:/registry:ro
      # Spec 020 (T171): the packed fixture extensions served by GET /download/:versionId.
      - ../fixtures/extensions:/fixtures:ro
    environment:
      PORT: '9100'
    ports:
      - '6113:9100'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9100/version || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    # minio/minio and minio/mc are no longer on Docker Hub; Chainguard's MinIO image also ships mc and a shell.
    image: cgr.dev/chainguard/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '8881:9000'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 5s
      retries: 60

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio: { condition: service_healthy }
    # Feature 020: the fixture extensions (package.json + dist) go to s3://directus/extensions/<name>/, replacing what a
    # previous run left there; the `extensions` profile prefix (extensions-ext) starts with parity-hook-audit only.
    volumes:
      - ../fixtures/extensions:/fixtures:ro
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/directus
      && mc rm --recursive --force local/directus/extensions local/directus/extensions-ext >/dev/null 2>&1; for d in
      /fixtures/parity-*; do n=$${d##*/}; mc cp --quiet $$d/package.json local/directus/extensions/$$n/package.json &&
      mc cp --quiet --recursive $$d/dist/ local/directus/extensions/$$n/dist/ || exit 1; done && mc cp --quiet
      /fixtures/parity-hook-audit/package.json local/directus/extensions-ext/parity-hook-audit/package.json && mc cp
      --quiet --recursive /fixtures/parity-hook-audit/dist/ local/directus/extensions-ext/parity-hook-audit/dist/"

  # Feature 007 (research R6): HTTP source of POST /files/import. The apps fetch it by service name; tests write large
  # files to .data/files-runtime at run time.
  files-fixtures:
    image: nginx:1.27-alpine
    volumes:
      - ./fixtures/files:/usr/share/nginx/html:ro
      - ./fixtures/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.data/files-runtime:/runtime:ro
    ports:
      - '8882:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/photo.jpg > /dev/null || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30

  directus:
    <<: *app
    image: directus/directus:11.17.4
    ports:
      - '8155:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api:
    <<: *app
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): Directus' architecture, sharp encodes AVIF to other bytes on arm64
    # Starts after Directus has bootstrapped the database (the API never writes it).
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8156:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 60

  directus-ratelimit:
    profiles: [ratelimit]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-ratelimit.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8255:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-ratelimit:
    profiles: [ratelimit]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): Directus' architecture, sharp encodes AVIF to other bytes on arm64
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-ratelimit.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8256:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  # Feature 004 (FR-106): the routes of the new app go to it, the rest to Directus (proxy/backoffice-routes.txt).
  proxy:
    profiles: [app]
    image: nginx:1.27-alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      directus: { condition: service_healthy }
      backoffice-api: { condition: service_healthy }
    ports:
      - '8160:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 60

  directus-user-limits:
    profiles: [user-limits]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-user-limits.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8855:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-user-limits:
    profiles: [user-limits]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): Directus' architecture, sharp encodes AVIF to other bytes on arm64
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-user-limits.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8856:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  directus-cors-hsts:
    profiles: [cors-hsts]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-cors-hsts.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8355:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-cors-hsts:
    profiles: [cors-hsts]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): Directus' architecture, sharp encodes AVIF to other bytes on arm64
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-cors-hsts.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8356:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  directus-pressure:
    profiles: [pressure]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-pressure.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8455:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -S --spider http://127.0.0.1:8055/server/ping 2>&1 | grep -qE "HTTP/1.1 (200|503)"']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-pressure:
    profiles: [pressure]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): Directus' architecture, sharp encodes AVIF to other bytes on arm64
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-pressure.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8456:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -S --spider http://127.0.0.1:8055/server/ping 2>&1 | grep -qE "HTTP/1.1 (200|503)"']
      interval: 3s
      timeout: 5s
      retries: 100

  directus-metrics:
    profiles: [metrics]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-metrics.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8555:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -S --spider http://127.0.0.1:8055/server/ping 2>&1 | grep -q "HTTP/1.1 200"']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-metrics:
    profiles: [metrics]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): Directus' architecture, sharp encodes AVIF to other bytes on arm64
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-metrics.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8556:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -S --spider http://127.0.0.1:8055/server/ping 2>&1 | grep -q "HTTP/1.1 200"']
      interval: 3s
      timeout: 5s
      retries: 100

  # Feature 002: a second Backoffice instance on the main pair's database, Redis and namespaces (US1, US3).
  backoffice-api-2:
    <<: *app
    profiles: [multi]
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): Directus' architecture, sharp encodes AVIF to other bytes on arm64
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8157:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 60

  # Feature 002: a pair with its own CACHE_NAMESPACE, bus, lock and permissions namespaces (US4, SC-004).
  directus-cache-config:
    profiles: [cache-config]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-cache-config.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8755:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-cache-config:
    profiles: [cache-config]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): Directus' architecture, sharp encodes AVIF to other bytes on arm64
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-cache-config.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8756:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 60

  # Feature 003: SSO pair. `idp` is the test identity provider (tests/parity/idp/server.mjs, research R10), also the
  # OAuth2 provider `oauthmock`; `ldap` is the OpenLDAP of directus/tests/blackbox/docker-compose.yml.
  idp:
    profiles: [sso]
    image: node:22-alpine
    command: ['node', '/idp/server.mjs']
    volumes:
      - ./idp:/idp:ro
    environment:
      PORT: '9000'
      IDP_ISSUER: http://idp:9000
      IDP_CLIENTS: '{"parity-client":"parity-secret"}'
    ports:
      - '6110:9000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9000/health || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30

  # Admin DN cn=Manager,dc=my-domain,dc=com, password `secret`, base DN dc=my-domain,dc=com (blackbox defaults).
  ldap:
    profiles: [sso]
    image: cleanstart/openldap:latest
    ports:
      - '6109:389'
    healthcheck:
      test: ['CMD', 'ldapsearch', '-x', '-H', 'ldap://localhost:389', '-b', '', '-s', 'base', '(objectClass=*)']
      interval: 5s
      timeout: 5s
      retries: 20

  directus-sso:
    profiles: [sso]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-sso.env
    depends_on:
      directus: { condition: service_healthy }
      idp: { condition: service_healthy }
      ldap: { condition: service_healthy }
    ports:
      - '8955:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-sso:
    profiles: [sso]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): Directus' architecture, sharp encodes AVIF to other bytes on arm64
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-sso.env
    depends_on:
      directus: { condition: service_healthy }
      idp: { condition: service_healthy }
      ldap: { condition: service_healthy }
    ports:
      - '8956:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 60

  # Feature 005 (research R5): own Redis of the cache-redis pair, stopped by redis-down.test.ts (FR-016, R-10) without
  # touching the other pairs. Same loop as `redis` so the container stays in Docker DNS while the server is down.
  redis-cache:
    profiles: [cache-redis]
    image: redis:7-alpine
    command: ['sh', '-c', 'while :; do [ -f /tmp/down ] || redis-server --save "" --appendonly no; sleep 0.2; done']
    stop_grace_period: 1s
    ports:
      - '6111:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 60

  # Feature 005 (research R5): the four response cache configurations of the Directus blackbox cache.test.ts and the
  # pair with WebSockets on (FR-045). Each pair reads the vendor env plus env/profile-<name>.env.
