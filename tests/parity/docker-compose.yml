    profiles: [graphql-nointro]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-graphql-nointro.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '10555:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-graphql-nointro:
    profiles: [graphql-nointro]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): Directus' architecture, sharp encodes AVIF to other bytes on arm64
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-graphql-nointro.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '10556:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  # Feature 020 (contracts/tests.md §3): the extensions pair (install from the registry, limits, MUST_LOAD, schedule).
  directus-extensions:
    profiles: [extensions]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-extensions.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '10655:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-extensions:
    profiles: [extensions]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): Directus' architecture, sharp encodes AVIF to other bytes on arm64
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-extensions.env
    depends_on:
      directus-extensions: { condition: service_healthy }
    ports:
      - '10656:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  # Spec 021 (contracts/tests.md): profile bootstrap. Directus 11.17.4 and Backoffice each bootstrap an EMPTY database
  # (Postgres postgres-bootstrap, or a SQLite file under .data/bootstrap when TEST_DB=sqlite3) with the image CMD, then
  # src/bootstrap compares the databases; directus-on-backoffice-db runs Directus on the database Backoffice made. Two
  # databases never share a Redis db or namespace (cache keys do not include the database; pub/sub ignores the db
  # number). The owner reports go to registry-bootstrap so their count belongs to this profile.
  postgres-bootstrap:
    profiles: [bootstrap]
    image: postgis/postgis:13-3.4-alpine
    environment:
      POSTGRES_PASSWORD: bootstrap-db-pass-91c2
      POSTGRES_DB: postgres
    volumes:
      - ./env/bootstrap-init.sql:/docker-entrypoint-initdb.d/bootstrap-init.sql:ro
    ports:
      - '6114:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d backoffice_partial']
      interval: 2s
      timeout: 5s
      retries: 60

  registry-bootstrap:
    profiles: [bootstrap]
    image: node:22-alpine
    command: ['node', '/registry/server.mjs']
    volumes:
      - ./registry:/registry:ro
      - ../fixtures/extensions:/fixtures:ro
    environment:
      PORT: '9100'
    ports:
      - '6115:9100'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9100/version || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30

  directus-bootstrap:
    profiles: [bootstrap]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/bootstrap:/directus/database/bootstrap
      - ./fixtures/migrations:/directus/migrations:ro
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-bootstrap.env
    environment:
      DB_DATABASE: directus_bootstrap
      DB_FILENAME: /directus/database/bootstrap/directus_bootstrap.db
      PUBLIC_URL: http://localhost:10755
      REDIS: redis://redis:6379/10
      CACHE_NAMESPACE: parity-bootstrap-d
      REDIS_BUS_NAMESPACE: parity-bootstrap-d:bus
      REDIS_LOCK_NAMESPACE: parity-bootstrap-d:lock
      MIGRATIONS_PATH: ${BOOTSTRAP_MIGRATIONS_DIR:-/directus/migrations}
    depends_on:
      postgres-bootstrap: { condition: service_healthy }
      registry-bootstrap: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - '10755:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-bootstrap:
    profiles: [bootstrap]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): one image for every pair
    volumes:
      - ./.data/bootstrap:/directus/database/bootstrap
      - ./fixtures/migrations:/directus/migrations:ro
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-bootstrap.env
    environment:
      DB_DATABASE: backoffice_bootstrap
      DB_FILENAME: /directus/database/bootstrap/backoffice_bootstrap.db
      PUBLIC_URL: http://localhost:10756
      REDIS: redis://redis:6379/11
      CACHE_NAMESPACE: parity-bootstrap-b
      REDIS_BUS_NAMESPACE: parity-bootstrap-b:bus
      REDIS_LOCK_NAMESPACE: parity-bootstrap-b:lock
      MIGRATIONS_PATH: ${BOOTSTRAP_MIGRATIONS_DIR:-/directus/migrations}
    depends_on:
      postgres-bootstrap: { condition: service_healthy }
      registry-bootstrap: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - '10756:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  directus-on-backoffice-db:
    profiles: [bootstrap]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/bootstrap:/directus/database/bootstrap
      - ./fixtures/migrations:/directus/migrations:ro
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-bootstrap.env
    environment:
      DB_DATABASE: backoffice_bootstrap
      DB_FILENAME: /directus/database/bootstrap/backoffice_bootstrap.db
      PUBLIC_URL: http://localhost:10757
      REDIS: redis://redis:6379/11
      CACHE_NAMESPACE: parity-bootstrap-b
      REDIS_BUS_NAMESPACE: parity-bootstrap-b:bus
      REDIS_LOCK_NAMESPACE: parity-bootstrap-b:lock
      MIGRATIONS_PATH: ${BOOTSTRAP_MIGRATIONS_DIR:-/directus/migrations}
    depends_on:
      backoffice-api-bootstrap: { condition: service_healthy }
    ports:
      - '10757:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  # Feature 012 (research R10, R13, contracts/e2e.md §3): the Backoffice web app (apps/web) in the three E2E configurations
  # of FR-071. backoffice-web (config.json apiUrl "/") sits behind two reverse proxies: /admin/ goes to it, the rest to
  # Directus (proxy-web-directus) or to the new API (proxy-web-api). backoffice-web-cors calls backoffice-api-web-cors
  # on another site (localhost:8181 -> 127.0.0.1:8163, CORS and SameSite=None cookies). Other apiUrl variants (sso,
  # setup pairs) use page.route('**/admin/config.json') in the specs, no more web containers.
  backoffice-web:
    profiles: [web]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: hiennd23/backoffice-web:local
    # Read by docker/40-config.sh: config.json gets apiUrl "/" (the API on the same origin, behind the proxies).
    # Feature 019: the FE sends the Directus CSP, made for an app on the API origin. The specs also point the app at
    # pairs on other local ports (setup pair, password-invite.spec.ts) and frame the live preview site of the fixture
    # set, so this test env lists them like an operator would. Lists merge item by item with the Directus ones
    # (apps/web/docker/csp.awk), so each list repeats the Directus items first.
    environment:
      PUBLIC_URL: /
      CONTENT_SECURITY_POLICY_DIRECTIVES__CONNECT_SRC: "array:'self',https://*,wss://*,http://127.0.0.1:*"
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: https://preview.example
    ports:
      - '8180:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/admin/config.json || exit 1']
      interval: 3s
      timeout: 5s
      retries: 60

  proxy-web-directus:
    profiles: [web]
    image: nginx:1.27-alpine
    volumes:
      - ./proxy/web-directus.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      directus: { condition: service_healthy }
      backoffice-web: { condition: service_healthy }
      backoffice-api: { condition: service_healthy }
    ports:
      - '8161:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- 127.0.0.1/server/ping && wget -qO- 127.0.0.1/admin/config.json || exit 1']
      interval: 3s
      timeout: 5s
      retries: 60

  proxy-web-api:
    profiles: [web]
    image: nginx:1.27-alpine
    volumes:
      - ./proxy/web-api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backoffice-api: { condition: service_healthy }
      backoffice-web: { condition: service_healthy }
    ports:
      - '8162:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- 127.0.0.1/server/ping && wget -qO- 127.0.0.1/admin/config.json || exit 1']
      interval: 3s
      timeout: 5s
      retries: 60

  backoffice-api-web-cors:
    profiles: [web]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: hiennd23/backoffice-api:local
    platform: linux/amd64 # feature 007 (research R2): one image for every pair
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
      - uploads:/directus/uploads
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      # Spec 020: the same fixture extensions as the main pair (Settings > Extensions in the cors configuration).
      - ./env/${PARITY_EXTENSIONS_ENV:-extensions}.env
      - ./env/profile-web-cors.env
    # Starts after Directus has bootstrapped the database (the API never writes migrations).
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8163:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 60

  backoffice-web-cors:
    profiles: [web]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: hiennd23/backoffice-web:local
    # config.json apiUrl: the API of the pair on another site (the browser opens http://localhost:8181).
    # Feature 019: the FE sends the Directus CSP, made for an app on the API origin; this app talks to APIs on other
    # local ports (8163, the SSO and setup pairs) and shows their /assets, so connect-src, img-src and media-src list
    # them, and frame-src the live preview site. Lists merge item by item with the Directus ones
    # (apps/web/docker/csp.awk), so each list repeats the Directus items first.
    environment:
      PUBLIC_URL: http://127.0.0.1:8163
      CONTENT_SECURITY_POLICY_DIRECTIVES__CONNECT_SRC: "array:'self',https://*,wss://*,http://127.0.0.1:*"
      CONTENT_SECURITY_POLICY_DIRECTIVES__IMG_SRC: "array:'self',data:,blob:,https://raw.githubusercontent.com,https://avatars.githubusercontent.com,http://127.0.0.1:*"
      CONTENT_SECURITY_POLICY_DIRECTIVES__MEDIA_SRC: "array:'self',http://127.0.0.1:*"
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: https://preview.example
    depends_on:
      backoffice-api-web-cors: { condition: service_healthy }
    ports:
      - '8181:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/admin/config.json || exit 1']
      interval: 3s
      timeout: 5s
      retries: 60

volumes:
  uploads:
