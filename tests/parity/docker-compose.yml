# Parity environment: one database vendor (profile), Redis, MinIO, Directus 11.17.4 and Backoffice.
# Both apps read the same env file (tests/parity/env/<vendor>.env), which proves SC-001.
#
#   pnpm nx run parity-tests:env-up --vendor=postgres
#   pnpm nx run parity-tests:env-down --vendor=postgres
#
# Host ports follow directus/tests/blackbox: DB 6100+, Redis 6108, MinIO 8881. Apps: Directus 8155, Backoffice 8156.
#
# Profiles ratelimit, cors-hsts, pressure (and metrics, US5) each add ONE MORE PAIR of containers (Directus +
# Backoffice) with the vendor env file plus env/profile-<name>.env, on their own ports and CACHE_NAMESPACE. The main
# pair never changes, so several profiles can run at once. Pairs start after the main Directus has bootstrapped.

x-app: &app
  env_file: ./env/${TEST_DB:-postgres}.env
  # SQLite: both apps open the same database file (ignored by the other vendors).
  volumes:
    - ./.data/sqlite:/directus/database/sqlite
  depends_on:
    postgres: { condition: service_healthy, required: false }
    postgres10: { condition: service_healthy, required: false }
    mysql: { condition: service_healthy, required: false }
    mysql5: { condition: service_healthy, required: false }
    maria: { condition: service_healthy, required: false }
    mssql: { condition: service_healthy, required: false }
    oracle: { condition: service_healthy, required: false }
    cockroachdb: { condition: service_healthy, required: false }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }

services:
  postgres:
    profiles: [postgres]
    image: postgis/postgis:13-3.4-alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: directus
    ports:
      - '6100:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d directus']
      interval: 2s
      timeout: 5s
      retries: 60

  postgres10:
    profiles: [postgres10]
    image: postgis/postgis:10-3.2-alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: directus
    ports:
      - '6101:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d directus']
      interval: 2s
      timeout: 5s
      retries: 60

  mysql:
    profiles: [mysql]
    image: mysql:8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: directus
    ports:
      - '6102:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -psecret --silent']
      interval: 3s
      timeout: 5s
      retries: 100

  mysql5:
    profiles: [mysql5]
    image: mysql:5
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: directus
    ports:
      - '6103:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -psecret --silent']
      interval: 3s
      timeout: 5s
      retries: 100

  maria:
    profiles: [maria]
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: directus
    ports:
      - '6104:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      timeout: 5s
      retries: 100

  mssql:
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Test@123
      MSSQL_PID: Express
    ports:
      - '6105:1433'
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Test@123 -Q "select 1" || exit 1']
      interval: 5s
      timeout: 10s
      retries: 60

  # Blackbox uses the unmaintained Oracle 18 image; CI uses Oracle XE 21 slim (spec Assumptions).
  oracle:
    profiles: [oracle]
    image: gvenzl/oracle-xe:21-slim-faststart
    environment:
      ORACLE_PASSWORD: secretpassword
      APP_USER: secretsysuser
      APP_USER_PASSWORD: secretpassword
    ports:
      - '6106:1521'
    shm_size: '1gb'
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 10s
      timeout: 10s
      retries: 60

  cockroachdb:
    profiles: [cockroachdb]
    image: cockroachdb/cockroach:latest-v24.3
    command: start-single-node --cluster-name=example-single-node --insecure --store=type=mem,size=4GB
    ports:
      - '6107:26257'
    healthcheck:
      test: ['CMD', 'cockroach', 'sql', '--insecure', '-e', 'select 1']
      interval: 3s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    ports:
      - '6108:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 60

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '8881:9000'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 5s
      retries: 60

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/directus"

  directus:
    <<: *app
    image: directus/directus:11.17.4
    ports:
      - '8155:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api:
    <<: *app
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    # Starts after Directus has bootstrapped the database (the API never writes it).
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8156:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 60

  directus-ratelimit:
    profiles: [ratelimit]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-ratelimit.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8255:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-ratelimit:
    profiles: [ratelimit]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-ratelimit.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8256:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  directus-cors-hsts:
    profiles: [cors-hsts]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-cors-hsts.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8355:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-cors-hsts:
    profiles: [cors-hsts]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-cors-hsts.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8356:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8055/server/ping || exit 1']
      interval: 3s
      timeout: 5s
      retries: 100

  directus-pressure:
    profiles: [pressure]
    image: directus/directus:11.17.4
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-pressure.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8455:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -S --spider http://127.0.0.1:8055/server/ping 2>&1 | grep -qE "HTTP/1.1 (200|503)"']
      interval: 3s
      timeout: 5s
      retries: 100

  backoffice-api-pressure:
    profiles: [pressure]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    volumes:
      - ./.data/sqlite:/directus/database/sqlite
    env_file:
      - ./env/${TEST_DB:-postgres}.env
      - ./env/profile-pressure.env
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8456:8055'
    healthcheck:
      test: ['CMD-SHELL', 'wget -S --spider http://127.0.0.1:8055/server/ping 2>&1 | grep -qE "HTTP/1.1 (200|503)"']
      interval: 3s
      timeout: 5s
      retries: 100
