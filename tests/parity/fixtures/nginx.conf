# files-fixtures (feature 007, research R6): source of POST /files/import in the parity environment.
server {
	listen 80;
	root /usr/share/nginx/html;

	# Final URL after redirects names the file (FR-060).
	location = /redirect/ { return 302 /photo.jpg; }
	location = /redirect-chain/ { return 302 /redirect/; }

	# Content-Encoding handled by decompressResponse (gzip, deflate, br) and one it stores as is.
	location = /gz/photo.jpg { add_header Content-Encoding gzip; alias /usr/share/nginx/html/photo.jpg.gz; }
	location = /br/photo.jpg { add_header Content-Encoding br; alias /usr/share/nginx/html/photo.jpg.br; }
	location = /zstd/photo.jpg { add_header Content-Encoding zstd; alias /usr/share/nginx/html/photo.jpg; }

	# Path ending in "/" (empty basename) and a response without Content-Type.
	location = /dir/ { default_type image/jpeg; try_files /photo.jpg =404; }
	location = /untyped { types { } default_type ""; try_files /photo.jpg =404; }

	# Large files written by the tests at run time (R-14).
	location /runtime/ { alias /runtime/; }
}
