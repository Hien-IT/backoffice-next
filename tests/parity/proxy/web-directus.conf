# Feature 012 (research R10, FR-071 configuration 1): /admin/ goes to the Backoffice web app, everything else to
# Directus 11.17.4. Static file (no template). Upstreams are variables resolved by the Docker DNS at request time, so a
# recreated container is reached without restarting this proxy (nginx otherwise keeps the IP it resolved at start).
log_format upstream '$remote_addr "$request" $status $upstream_addr';

server {
	listen 80;
	access_log /var/log/nginx/access.log upstream;
	client_max_body_size 50m;
	resolver 127.0.0.11 valid=5s ipv6=off;
	# Keep the client port in redirects (ports are remapped on the host).
	absolute_redirect off;

	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	location = /admin {
		return 302 /admin/;
	}

	location /admin/ {
		set $web backoffice-web:8080;
		proxy_pass http://$web;
	}

	location / {
		set $api directus:8055;
		proxy_pass http://$api;
	}
}
