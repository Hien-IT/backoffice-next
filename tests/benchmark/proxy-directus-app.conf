# Web benchmarks (R11 of spec 020, owner 2026-10-22): the Directus app is measured through an nginx proxy like the two
# Backoffice web setups (web-directus.conf, web-api.conf), so the three pay the same extra hop: same resolver, upstream
# variable (a new connection per request) and HTTP/1.1. Everything goes to Directus 11.17.4, its /admin app included.
server {
	listen 80;
	client_max_body_size 50m;
	resolver 127.0.0.11 valid=5s ipv6=off;
	absolute_redirect off;

	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	location / {
		set $api directus:8055;
		proxy_pass http://$api;
	}
}
