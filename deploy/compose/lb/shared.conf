# Next to Directus (spec 026 FR-001, FR-002; 019 FR-070): 8080 is the Directus domain (Directus only, its own /admin),
# 8081 the Backoffice domain (/admin -> FE, the rest -> the BE replicas only; Directus never joins that pool).
# `shared` = the shared DB, Redis and storage, like `mode: shared` of the Helm chart.
log_format upstream '$remote_addr "$request" $status $upstream_addr $upstream_status $server_port';

resolver 127.0.0.11 valid=5s ipv6=off;

upstream bo_pool {
	zone bo_pool 64k;
	# `resolve` follows the replicas when they are scaled (Docker DNS, 019 research R5); max_fails=0: a failed connect
	# never takes a server out of the pool (slow connects on a busy host marked every server down, CI run 39368507371).
	server backoffice-api:8055 resolve max_fails=0;
}

access_log /dev/stdout upstream;
proxy_http_version 1.1;
# No upstream keepalive: a replica that closed its listener refuses the connection and nginx sends the request to
# another one before any byte left (019 FR-035). http_503: a replica back from a restart sheds load while it warms up
# (pressure limiter); nginx sends GET/HEAD/OPTIONS on to another server, never a POST/PATCH/DELETE.
proxy_next_upstream error timeout http_503;
# A stopped replica's IP leaves Docker DNS but stays in the upstream for up to `valid`: fail the connect fast.
proxy_connect_timeout 1s;
client_max_body_size 0;
proxy_request_buffering off;
proxy_read_timeout 300s;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

server {
	listen 8080;

	location / {
		proxy_pass http://directus:8055;
	}
}

server {
	listen 8081;

	location = /admin {
		proxy_pass http://backoffice-web:8080;
	}

	location /admin/ {
		proxy_pass http://backoffice-web:8080;
	}

	location / {
		# A 502/504 that nginx itself makes (no upstream answered: a stopped replica's IP still in the pool while DNS
		# updates) gets one more pick from the current pool. Upstream answers pass through (proxy_intercept_errors off).
		error_page 502 504 = @retry;
		proxy_pass http://bo_pool;
	}

	location @retry {
		proxy_pass http://bo_pool;
	}
}
