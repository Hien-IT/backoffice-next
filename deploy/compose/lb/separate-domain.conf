# Separate domains (spec 019 FR-070): 8080 is the Directus domain (Directus only, its own /admin), 8081 the Backoffice
# domain (/admin -> FE, the rest -> the BE replicas only). Proxy settings as in shared-domain.conf.
log_format upstream '$remote_addr "$request" $status $upstream_addr $upstream_status $server_port';

resolver 127.0.0.11 valid=5s ipv6=off;

upstream bo_pool {
	zone bo_pool 64k;
	server backoffice-api:8055 resolve max_fails=0; # see shared-domain.conf
}

access_log /dev/stdout upstream;
proxy_http_version 1.1;
proxy_next_upstream error timeout;
proxy_connect_timeout 1s;
client_max_body_size 0;
proxy_request_buffering off;
proxy_read_timeout 300s;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

server {
	listen 8080;

	location / {
		proxy_pass http://directus:8055;
	}
}

server {
	listen 8081;

	location = /admin {
		proxy_pass http://backoffice-web:8080;
	}

	location /admin/ {
		proxy_pass http://backoffice-web:8080;
	}

	location / {
		# Second pick on a 502/504 made by nginx itself: see shared-domain.conf.
		error_page 502 504 = @retry;
		proxy_pass http://bo_pool;
	}

	location @retry {
		proxy_pass http://bo_pool;
	}
}
