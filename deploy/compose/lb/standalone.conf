# Spec 021 (standalone, contracts/deploy.md): like shared-domain.conf without Directus: /admin -> FE, every other path
# -> the BE replicas.
log_format upstream '$remote_addr "$request" $status $upstream_addr $upstream_status';

# Docker DNS: `resolve` follows the BE replicas when they are scaled (research R5).
resolver 127.0.0.11 valid=5s ipv6=off;

# max_fails=0: a failed connect never takes a server out of the pool. With the default (1 failure per 10 s), slow
# connects on a busy host marked every server down at once and nginx answered "no live upstreams" (CI run 39368507371);
# a stopped replica only costs proxy_connect_timeout before nginx tries the next server, until DNS drops it.
upstream api_pool {
	zone api_pool 64k;
	server backoffice-api:8055 resolve max_fails=0;
}

# Spec 020 (D-137): /extensions/sources/* goes to the Backoffice replicas; without Directus it is the same pool.
upstream bo_pool {
	zone bo_pool 64k;
	server backoffice-api:8055 resolve max_fails=0;
}

server {
	listen 8080;
	access_log /dev/stdout upstream;

	# No upstream keepalive: a replica that closed its listener refuses the connection and nginx sends the request to
	# another one before any byte left (FR-035, research R4).
	proxy_http_version 1.1;
	# http_503: a replica back from a restart sheds load while it warms up (pressure limiter, CI runs 39380364588 and
	# 39424546071); nginx sends GET/HEAD/OPTIONS on to another server, never a POST/PATCH/DELETE (no non_idempotent).
	proxy_next_upstream error timeout http_503;
	# A stopped replica's IP leaves Docker DNS but stays in the upstream for up to `valid`: connecting there hangs
	# (no RST), so fail the connect fast and let proxy_next_upstream try another server.
	proxy_connect_timeout 1s;
	client_max_body_size 0;
	proxy_request_buffering off;
	proxy_read_timeout 300s;
	proxy_set_header Host $http_host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Connection "";

	location = /admin {
		proxy_pass http://backoffice-web:8080;
	}

	location /admin/ {
		proxy_pass http://backoffice-web:8080;
	}

	location ^~ /extensions/sources/ {
		error_page 502 504 = @retry_bo;
		proxy_pass http://bo_pool;
	}

	location @retry_bo {
		proxy_pass http://bo_pool;
	}

	location / {
		# A 502/504 that nginx itself makes (no upstream answered: a stopped replica's IP still in the pool while DNS
		# updates) gets one more pick from the current pool. Upstream answers pass through (proxy_intercept_errors off).
		# Limit: a request cut after it reached a replica (longer than SERVER_SHUTDOWN_TIMEOUT) is sent once more.
		error_page 502 504 = @retry;
		proxy_pass http://api_pool;
	}

	location @retry {
		proxy_pass http://api_pool;
	}
}
