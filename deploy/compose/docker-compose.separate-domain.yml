# Feature 019, US9 (FR-070..FR-072): Backoffice on its own domain (http://localhost:8091), Directus keeps its domain
# (http://localhost:8090) with its own /admin; both on the same Postgres, Redis and MinIO. The env file is unchanged:
# only PUBLIC_URL is set for the Backoffice services (FR-071, Principle VIII exception approved in T079).
#
#   docker compose -f docker-compose.yml -f docker-compose.separate-domain.yml up -d --wait

services:
  backoffice-api:
    environment:
      PUBLIC_URL: http://localhost:8091

  backoffice-web:
    environment:
      PUBLIC_URL: http://localhost:8091

  lb:
    ports:
      - '8091:8081'
    volumes:
      - ./lb/separate-domain.conf:/etc/nginx/conf.d/default.conf:ro
