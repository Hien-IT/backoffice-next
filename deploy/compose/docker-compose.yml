# Feature 019, spec 026: Directus 11.17.4 and Backoffice (BE replicas, FE) on two domains of one nginx load balancer, on
# shared Postgres, Redis and MinIO (S3). Directus and the BE read the same env file; only the image differs (019 FR-041)
# and the Backoffice services set PUBLIC_URL to their own domain (026 FR-003, Principle VIII).
#
#   cd deploy/compose
#   ./init-env.sh                                   # once: .env with random secrets
#   docker compose up -d --wait                     # 2 BE replicas
#   BACKOFFICE_REPLICAS=3 docker compose up -d --wait
#   docker compose down [-v]
#
# Ports: http://localhost:8090 (the Directus domain: everything, its own /admin, to Directus), http://localhost:8091 (the
# Backoffice domain: /admin -> FE, the rest -> the BE replicas only), http://localhost:8095 (Directus directly), one
# random port per BE replica (`docker compose port --index <i> backoffice-api 8055`). Admin: ADMIN_EMAIL /
# ADMIN_PASSWORD in .env.

name: bo-deploy

x-app-env: &app-env
  env_file: ${DEPLOY_ENV_FILE:-.env}

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 60

  minio:
    # minio/minio and minio/mc are no longer on Docker Hub; Chainguard's MinIO image also ships mc and a shell.
    image: cgr.dev/chainguard/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 5s
      retries: 60

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${STORAGE_S3_KEY} $${STORAGE_S3_SECRET} && mc mb
      --ignore-existing local/$${STORAGE_S3_BUCKET}"
    environment:
      STORAGE_S3_KEY: ${STORAGE_S3_KEY}
      STORAGE_S3_SECRET: ${STORAGE_S3_SECRET}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}

  directus:
    <<: *app-env
    image: directus/directus:11.17.4
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports:
      - '8095:8055'
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:8055/server/health || exit 1']
      interval: 2s
      timeout: 5s
      retries: 90

  backoffice-api:
    <<: *app-env
    image: hiennd23/backoffice-api:${BACKOFFICE_TAG:-latest}
    platform: linux/amd64
    deploy:
      replicas: ${BACKOFFICE_REPLICAS:-2}
    # Spec 026 (FR-003): the one variable set apart from the Directus env, the URL of the Backoffice domain.
    environment:
      PUBLIC_URL: http://localhost:8091
    depends_on:
      directus: { condition: service_healthy }
    ports:
      - '8055'
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:8055/server/health || exit 1']
      interval: 2s
      timeout: 5s
      retries: 60

  backoffice-web:
    <<: *app-env
    image: hiennd23/backoffice-web:${BACKOFFICE_TAG:-latest}
    platform: linux/amd64
    environment:
      PUBLIC_URL: http://localhost:8091
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:8080/admin/config.json || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30

  lb:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine
    depends_on:
      backoffice-api: { condition: service_healthy }
      backoffice-web: { condition: service_healthy }
    ports:
      - '8090:8080' # the Directus domain
      - '8091:8081' # the Backoffice domain
    volumes:
      - ./lb/shared.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:8080/admin/config.json || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30

  # Spec 020 (contracts/deploy.md §1): the fake extensions registry of the parity tests, for the acceptance suite only
  # (tests/parity/src/deploy/global-setup.ts adds MARKETPLACE_REGISTRY=http://registry:9100 to the test env file).
  registry:
    profiles: [extensions-test]
    image: node:22-alpine
    command: ['node', '/registry/server.mjs']
    volumes:
      - ../../tests/parity/registry:/registry:ro
      - ../../tests/fixtures/extensions:/fixtures:ro
    environment:
      PORT: '9100'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9100/version || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  minio-data:
