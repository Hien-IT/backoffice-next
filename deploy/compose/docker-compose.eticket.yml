version: '3.5'

x-app-env: &app-env
  KEY:
  SECRET:
  MAX_PAYLOAD_SIZE: 10mb
  DB_CLIENT: pg
  DB_HOST: database
  DB_PORT: 5432
  DB_DATABASE: ${APP_TENANT}
  DB_USER: ${APP_TENANT}
  DB_PASSWORD: ${APP_TENANT}
  CORS_ENABLED: 'true'
  CORS_ORIGIN: '*'
  CORS_METHODS: 'GET,POST,PUT,DELETE'
  CORS_ALLOWED_HEADERS: 'Content-Type,Authorization,X-Requested-With'
  CORS_EXPOSED_HEADERS: 'Content-Range,X-Content-Range'
  MARKETPLACE_TRUST: all
  MARKETPLACE_REGISTRY:
  REDIS: redis://cache:6379
  CACHE_ENABLED: true
  CACHE_STORE: redis
  CACHE_AUTO_PURGE: true
  RATE_LIMITER_ENABLED: false
  RATE_LIMITER_STORE: redis
  SYNCHRONIZATION_STORE: redis
  ADMIN_EMAIL:
  ADMIN_PASSWORD:
  PUBLIC_URL:
  NODE_ENV: 'production'
  EXTENSIONS_AUTO_RELOAD: 'true'
  STORAGE_LOCATIONS: s3
  STORAGE_S3_DRIVER: s3
  STORAGE_S3_KEY:  ${APP_TENANT}
  STORAGE_S3_SECRET:  ${APP_TENANT}
  STORAGE_S3_BUCKET:  ${APP_TENANT}
  STORAGE_S3_REGION: us-east-1
  STORAGE_S3_ENDPOINT: http://minio:9000
  STORAGE_S3_FORCE_PATH_STYLE: true
  EXTENSIONS_LOCATION: s3
  TUS_ENABLED: true
  WEBSOCKETS_ENABLED: false

services:
  database:
    image: postgis/postgis:16-3.4
    networks:
      - eticketing
    volumes:
      - database-postgis:/var/lib/postgresql/data
    environment:
      POSTGRESQL_USERNAME: ${APP_TENANT}
      POSTGRESQL_PASSWORD: ${APP_TENANT}
      POSTGRESQL_DATABASE: ${APP_TENANT}
      POSTGRES_USER: ${APP_TENANT}
      POSTGRES_DB: ${APP_TENANT}
      POSTGRES_PASSWORD: ${APP_TENANT}

  cache:
    image: redis:6
    networks:
      - eticketing

  directus:
    image: 'directus/directus:11.17.4'
    networks:
      - gateway
      - eticketing
    depends_on:
      - cache
      - database
    environment:
      <<: *app-env
    labels:
      - nitegate.enable=true
      - nitegate.eticketing-backoffice.domain=
      - nitegate.eticketing-backoffice.port=8055
      - nitegate.eticketing-backoffice.ssl=letsencrypt
      - nitegate.eticketing-backoffice.path_prefix=/

  minio:
    # minio/minio and minio/mc are no longer on Docker Hub; Chainguard's MinIO image also ships mc and a shell.
    image: cgr.dev/chainguard/minio:latest
    command: server /data
    networks:
      - eticketing
    environment:
      MINIO_ROOT_USER: ${APP_TENANT}
      MINIO_ROOT_PASSWORD: ${APP_TENANT}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 5s
      retries: 60

  backoffice-api:
    environment:
      <<: *app-env
      PUBLIC_URL:
    image: hiennd23/backoffice-api:latest
    networks:
      - gateway
      - eticketing
    labels:
      - nitegate.enable=true
      - nitegate.eticketing-backoffice-next-api.domain=
      - nitegate.eticketing-backoffice-next-api.port=8055
      - nitegate.eticketing-backoffice-next-api.ssl=letsencrypt
      - nitegate.eticketing-backoffice-next-api.path_prefix=/

  backoffice-web:
    environment:
      <<: *app-env
      PUBLIC_URL:
    image: hiennd23/backoffice-web:latest
    networks:
      - gateway
      - eticketing
    labels:
      - nitegate.enable=true
      - nitegate.eticketing-backoffice-next.domain=
      - nitegate.eticketing-backoffice-next.port=8080
      - nitegate.eticketing-backoffice-next.ssl=letsencrypt
      - nitegate.eticketing-backoffice-next.path_prefix=/admin/


  # minio-init:
  #   image: cgr.dev/chainguard/minio:latest
  #   networks:
  #     - eticketing
  #   depends_on:
  #     minio: { condition: service_healthy }
  #   entrypoint: >
  #     /bin/sh -c "mc alias set local http://minio:9000 $${STORAGE_S3_KEY} $${STORAGE_S3_SECRET} && mc mb
  #     --ignore-existing local/$${STORAGE_S3_BUCKET}"
  #   environment:
  #     STORAGE_S3_KEY: ${APP_TENANT}
  #     STORAGE_S3_SECRET: ${APP_TENANT}
  #     STORAGE_S3_BUCKET: ${APP_TENANT}


networks:
  eticketing:

  gateway:
    external: true

volumes:
  database:
  database-postgis:
  minio-data:


