# Feature 019, CI only (T097): the chart on a kind cluster with the images of the CI `docker` job.
directus:
  configMap: directus-config
  secret: directus-secret
api:
  image: { tag: ci, pullPolicy: Never }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70 }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
web:
  image: { tag: ci, pullPolicy: Never }
# Spec 026: the Backoffice domain of the kind cluster; Directus (ci/deps.yaml) keeps cms.test without an Ingress.
ingress:
  className: traefik
  host: backoffice.test
domain:
  publicUrl: http://backoffice.test
