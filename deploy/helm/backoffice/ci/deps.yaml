# Feature 019, CI only (T091): what a Directus deployment already has before the chart is installed: Postgres, Redis,
# MinIO, Directus 11.17.4 with its ConfigMap and Secret. Not for production use.
apiVersion: v1
kind: ConfigMap
metadata: { name: directus-config }
data:
  PUBLIC_URL: http://cms.test
  ADMIN_EMAIL: admin@example.com
  DB_CLIENT: pg
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_DATABASE: directus
  DB_USER: directus
  REDIS: redis://redis:6379
  CACHE_ENABLED: 'true'
  CACHE_STORE: redis
  CACHE_AUTO_PURGE: 'true'
  RATE_LIMITER_STORE: redis
  SYNCHRONIZATION_STORE: redis
  STORAGE_LOCATIONS: s3
  STORAGE_S3_DRIVER: s3
  STORAGE_S3_BUCKET: directus
  STORAGE_S3_REGION: us-east-1
  STORAGE_S3_ENDPOINT: http://minio:9000
  STORAGE_S3_FORCE_PATH_STYLE: 'true'
  WEBSOCKETS_ENABLED: 'false'
  # Spec 020 (FR-045): every pod loads the extensions from the shared storage.
  EXTENSIONS_LOCATION: s3
  # The rolling update under load checks that no request fails while pods are replaced, not overload: no pressure
  # limiter, like deps-standalone.yaml (503s from the limiter in the shared-mode rolling update on CI).
  PRESSURE_LIMITER_ENABLED: 'false'
---
apiVersion: v1
kind: Secret
metadata: { name: directus-secret }
stringData:
  SECRET: kind-test-secret-0123456789abcdef
  ADMIN_PASSWORD: kind-test-admin
  DB_PASSWORD: kind-test-db
  STORAGE_S3_KEY: kindtestkey
  STORAGE_S3_SECRET: kind-test-s3-secret
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4-alpine
          env:
            - { name: POSTGRES_USER, value: directus }
            - { name: POSTGRES_DB, value: directus }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: directus-secret, key: DB_PASSWORD } } }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, directus] }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe: { exec: { command: [redis-cli, ping] }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio }
spec:
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest
          args: [server, /data]
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: directus-secret, key: STORAGE_S3_KEY } } }
            - {
                name: MINIO_ROOT_PASSWORD,
                valueFrom: { secretKeyRef: { name: directus-secret, key: STORAGE_S3_SECRET } },
              }
          ports: [{ containerPort: 9000 }]
          readinessProbe: { exec: { command: [mc, ready, local] }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: minio }
spec: { selector: { app: minio }, ports: [{ port: 9000 }] }
---
apiVersion: batch/v1
kind: Job
metadata: { name: minio-init }
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: cgr.dev/chainguard/minio:latest
          # Spec 020: the parity-endpoint-demo fixture (ConfigMap made by kind-test.sh, optional) goes to extensions/.
          command:
            - sh
            - -c
            - >-
              mc alias set local http://minio:9000 "$KEY" "$SECRET" && mc mb --ignore-existing local/directus && if [ -f
              /fixture/package.json ]; then mc cp /fixture/package.json
              local/directus/extensions/parity-endpoint-demo/package.json && mc cp /fixture/index.js
              local/directus/extensions/parity-endpoint-demo/dist/index.js; fi
          env:
            - { name: KEY, valueFrom: { secretKeyRef: { name: directus-secret, key: STORAGE_S3_KEY } } }
            - { name: SECRET, valueFrom: { secretKeyRef: { name: directus-secret, key: STORAGE_S3_SECRET } } }
          volumeMounts: [{ name: fixture, mountPath: /fixture }]
      volumes:
        - { name: fixture, configMap: { name: extension-fixture, optional: true } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: directus }
spec:
  selector: { matchLabels: { app: directus } }
  template:
    metadata: { labels: { app: directus } }
    spec:
      containers:
        - name: directus
          image: directus/directus:11.17.4
          envFrom:
            - configMapRef: { name: directus-config }
            - secretRef: { name: directus-secret }
          ports: [{ containerPort: 8055 }]
          readinessProbe: { httpGet: { path: /server/health, port: 8055 }, periodSeconds: 3, failureThreshold: 100 }
---
apiVersion: v1
kind: Service
metadata: { name: directus }
spec: { selector: { app: directus }, ports: [{ port: 8055 }] }
