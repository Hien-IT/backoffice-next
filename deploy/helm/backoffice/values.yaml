# Feature 019 (specs/019-deployment-packaging/contracts/helm-values.md). The chart declares no Directus variable: the
# pods read the ConfigMap and Secret the Directus deployment already uses (envFrom).

# Spec 021 (FR-080): `shared` (019): the pods run the image CMD (bootstrap, then start) next to Directus, whose
# Deployment bootstraps the database first. `standalone`: no Directus; a pre-install/pre-upgrade Job runs
# `node cli.js bootstrap` once, then the pods only run `start`. directus.configMap / directus.secret then name the
# Backoffice env (same variables as Directus), created before `helm install`.
mode: shared

# Spec 021 (FR-081): the bootstrap Job of the standalone mode.
bootstrap:
  backoffLimit: 3
  # At least 3 times a bootstrap of an empty database (SC-010).
  activeDeadlineSeconds: 600
  resources: {} # empty: the api resources

# Spec 021 (FR-085): a ConfigMap of custom migrations (.js files), mounted at /backoffice/migrations (the default
# MIGRATIONS_PATH ./migrations) in the bootstrap Job and the api pods, in both modes. Run `helm upgrade` right after
# changing it: the Job applies the new files, then the pods roll.
migrations:
  configMap: ''

directus:
  # Required: name of the ConfigMap that holds the Directus env (BE and FE read it).
  configMap: ''
  # Required: name of the Secret that holds the Directus secrets (BE only).
  secret: ''

api:
  image:
    repository: hiennd23/backoffice-api
    tag: '' # defaults to the chart appVersion
    pullPolicy: IfNotPresent
  # Used when autoscaling is off.
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  # preStop sleep: the pod keeps serving while the endpoint leaves the Service, then gets SIGTERM (research R4).
  shutdownDelaySeconds: 10
  # Must exceed shutdownDelaySeconds + SERVER_SHUTDOWN_TIMEOUT + closing connections.
  terminationGracePeriodSeconds: 30

# The Service of the API selects every pod with the label backoffice.io/api-pool: <name>. Add the same label to the
# pod template of a Directus Deployment to put it in the pool (shared domain); leave it out for a separate domain.
apiPool:
  name: '' # defaults to the release name

# PVC already used by Directus for STORAGE_LOCATIONS=local (ReadWriteMany), mounted at /backoffice/uploads (D-174).
uploads:
  existingClaim: ''

# Spec 020 (FR-045): with several API replicas (or HPA) the chart requires EXTENSIONS_LOCATION in the Directus env, so
# every pod loads the same extensions from the shared storage. true: the extensions are baked into the image
# (/backoffice/extensions), the check is skipped and marketplace installs are not used.
extensions:
  inImage: false

web:
  image:
    repository: hiennd23/backoffice-web
    tag: '' # defaults to the chart appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }

ingress:
  enabled: true
  className: ''
  # Required: the domain of the app (shared domain: the Directus domain; separate domain: the Backoffice domain).
  host: ''
  tls: []
  # Controller annotations (body size, buffering, timeouts): see deploy/README.md.
  annotations: {}
  # Paths routed before `/`, e.g. the SAML login of Directus: [{ path: /auth/login/saml, pathType: Prefix, service: directus, port: 8055 }]
  extraPaths: []

# Separate domain only (FR-071): the PUBLIC_URL of the Backoffice domain. No other variable can be set here.
domain:
  publicUrl: ''
