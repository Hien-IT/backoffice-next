apiVersion: v1
kind: Service
metadata:
  name: {{ include "backoffice.name" . }}-api
  labels:
    {{- include "backoffice.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  # The BE pods of this release only (spec 026 FR-006): Directus never joins the pool.
  selector:
    {{- include "backoffice.selector" (dict "Release" .Release "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 8055, targetPort: 8055 }
