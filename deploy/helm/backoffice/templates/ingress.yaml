{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required" .Values.ingress.host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "backoffice.name" . }}
  labels:
    {{- include "backoffice.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range .Values.ingress.extraPaths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service: { name: {{ .service }}, port: { number: {{ .port }} } }
          {{- end }}
          # Spec 020 (D-137): the app extension chunks come from the Backoffice pods only.
          - path: /extensions/sources
            pathType: Prefix
            backend:
              service: { name: {{ include "backoffice.name" . }}-api-only, port: { number: 8055 } }
          # Spec 025 (D-189.7): /permissions/me with the import and export keys and /backoffice/* from the Backoffice pods
          # only.
          - path: /permissions/me
            pathType: Exact
            backend:
              service: { name: {{ include "backoffice.name" . }}-api-only, port: { number: 8055 } }
          - path: /backoffice
            pathType: Prefix
            backend:
              service: { name: {{ include "backoffice.name" . }}-api-only, port: { number: 8055 } }
          - path: /admin
            pathType: Prefix
            backend:
              service: { name: {{ include "backoffice.name" . }}-web, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "backoffice.name" . }}-api, port: { number: 8055 } }
{{- end }}
