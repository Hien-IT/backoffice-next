{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required" .Values.ingress.host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "backoffice.name" . }}
  labels:
    {{- include "backoffice.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range .Values.ingress.extraPaths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service: { name: {{ .service }}, port: { number: {{ .port }} } }
          {{- end }}
          # Spec 026 (FR-007, FR-009): the Backoffice domain only; every API path, /extensions/sources, /permissions/me
          # and /backoffice/* included, reaches the BE pods through the one Service.
          - path: /admin
            pathType: Prefix
            backend:
              service: { name: {{ include "backoffice.name" . }}-web, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "backoffice.name" . }}-api, port: { number: 8055 } }
{{- end }}
