apiVersion: v1
kind: Service
metadata:
  name: {{ include "backoffice.name" . }}-web
  labels:
    {{- include "backoffice.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "backoffice.selector" (dict "Release" .Release "component" "web") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
