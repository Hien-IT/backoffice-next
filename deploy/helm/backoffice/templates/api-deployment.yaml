{{- include "backoffice.checks" . -}}
{{- $configMap := required "directus.configMap is required (the ConfigMap of the Directus deployment)" .Values.directus.configMap -}}
{{- $secret := required "directus.secret is required (the Secret of the Directus deployment)" .Values.directus.secret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backoffice.name" . }}-api
  labels:
    {{- include "backoffice.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "backoffice.selector" (dict "Release" .Release "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backoffice.selector" (dict "Release" .Release "component" "api") | nindent 8 }}
        backoffice.io/api-pool: {{ include "backoffice.pool" . }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- include "backoffice.securityContext" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8055 }
          envFrom:
            - configMapRef: { name: {{ $configMap }} }
            - secretRef: { name: {{ $secret }} }
          {{- with .Values.domain.publicUrl }}
          env:
            - { name: PUBLIC_URL, value: {{ . | quote }} }
          {{- end }}
          startupProbe:
            httpGet: { path: /server/ping, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /server/health, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /server/ping, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "{{ .Values.api.shutdownDelaySeconds }}"] }
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- with .Values.uploads.existingClaim }}
          volumeMounts:
            - { name: uploads, mountPath: /directus/uploads }
          {{- end }}
      {{- with .Values.uploads.existingClaim }}
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: {{ . }} }
      {{- end }}
