# Backoffice on its own domain next to Directus (spec 019 US9). Only PUBLIC_URL differs from the Directus env.
directus:
  configMap: directus-config
  secret: directus-secret
ingress:
  host: backoffice.example.com
domain:
  publicUrl: https://backoffice.example.com
apiPool:
  name: backoffice-separate # no Directus pod carries this label
