# gitleaks configuration (CI job `security`, T098). Default rules, plus an allowlist for test-only credentials
# (parity environment files, the local Directus reference) and the read-only Directus source.
[extend]
useDefault = true

[allowlist]
description = "Test-only credentials and the read-only Directus reference"
paths = [
  '''^directus/''',
  '''^tests/parity/env/[^/]+\.env$''',
  '''^dev/directus-reference/''',
  # Feature 005: the copy of directus/tests/blackbox (fixed ids and static tokens of its test users) and the cache keys
  # (object-hash values) that the ported get-cache-key test expects.
  '''^tests/parity/src/items/blackbox/''',
  '''^apps/api/src/utils/get-cache-key\.test\.ts$''',
  # Feature 009: the fake keys of the ported redact-object test (the values it checks are redacted).
  '''^apps/api/src/utils/redact-object\.test\.ts$''',
  # Feature 019: the credentials of the throwaway kind cluster of the CI job deploy-k8s.
  '''^deploy/helm/backoffice/ci/deps\.yaml$''',
  '''(^|/)node_modules/''',
  '''(^|/)(dist|coverage|graphify-out)/''',
]
# Example values of the OpenAPI spec ported from Directus (libs/specs), not credentials.
regexes = ['''^7RwVrquB5dPmfbrI1rcWy$''']
