# Security patches of transitive dependencies (plan.md Complexity Tracking).
overrides:
  vue@<3.5.43: 3.5.43 # @directus/extensions-sdk 17.1.4 (tests/fixtures/extensions) pins vue 3.5.24: same security patch as the catalog, one vue in the tree
  fast-xml-parser@>=5.0.0 <5.5.6: 5.5.12 # via @aws-sdk/client-s3
  js-yaml@>=4.0.0 <4.3.2: 4.3.2 # via @directus/utils 13.4.1 (apps/web, feature 013)
  joi@>=18.0.0 <18.2.6: 18.2.6 # via @directus/utils 13.4.1 (apps/web, feature 013), same patch as apps/api
  nanoid@>=4.0.0 <5.1.16: 5.1.16 # via @directus/composables 11.4.1 (apps/web, spec 020): GHSA-28wg-ghj8-5hjv, GHSA-xwg4-73v4-xw9w, same patch as the catalog

# tar 6 comes with sqlite3 5.1.7 (same as Directus 11.17.4); only sqlite3/deps/extract.js loads it, to unpack the
# bundled SQLite source when node-gyp builds from source. Runtime code never loads it, and tar 7 would change major
# under sqlite3. Accepted in plan.md Complexity Tracking.
auditConfig:
  ignoreGhsas:
    - GHSA-34x7-hfp2-rc4v
    - GHSA-8qq5-rm4j-mr97
    - GHSA-83g3-92jg-28cx
    - GHSA-qffp-2rhf-9h96
    - GHSA-9ppj-qmqm-q256
    - GHSA-r6q2-hw4h-h46w
    - GHSA-23hp-3jrh-7fpw
    - GHSA-8x88-c5mf-7j5w
    - GHSA-r292-9mhp-454m
    # sharp 0.34.5 and axios 1.15.0 are the Directus 11.17.4 versions. sharp decides the bytes of shared derived
    # assets (spec 007 SC-004: 0.35.5 changes avif and tiff output), axios decides URL import behaviour (R-14).
    # The owner chose to keep both on 2026-10-13; accepted in specs/007-files-assets/plan.md Complexity Tracking.
    # Raise together with the Directus baseline.
    - GHSA-f88m-g3jw-g9cj # sharp: libvips
    - GHSA-rgj7-g3m4-5g8c # sharp: libheif
    - GHSA-wq5f-xc86-pv6w # sharp: librsvg
    - GHSA-35jp-ww65-95wh # axios
    - GHSA-3g43-6gmg-66jw # axios
    - GHSA-3pq3-5fj3-cg6v # axios
    - GHSA-542g-h47m-68v8 # axios
    - GHSA-6chq-wfr3-2hj9 # axios
    - GHSA-777c-7fjr-54vf # axios
    - GHSA-hfxv-24rg-xrqf # axios
    - GHSA-j5f8-grm9-p9fc # axios
    - GHSA-mghh-pgcx-3jjj # axios
    - GHSA-p92q-9vqr-4j8v # axios
    - GHSA-pf86-5x62-jrwf # axios
    - GHSA-pjwm-pj3p-43mv # axios
    - GHSA-pmwg-cvhr-8vh7 # axios
    - GHSA-q8qp-cvcw-x6jj # axios
    # tinymce 6.8.6 (apps/web, input-rich-text-html) is the Directus 11.17.4 version; the fixes are only in TinyMCE
    # >= 7.1.0 / 7.9.3, which is GPL (spec 013 FR-064). The owner chose to keep 6.8.6 like Directus on 2026-10-15
    # (spec 013 D-61, research R1); stored HTML goes through TinyMCE's own sanitizer as in Directus. Raise together with
    # the Directus baseline.
    - GHSA-mh5m-5hw4-5c69 # tinymce: XSS via sanitization bypass (fixed 7.1.0)
    - GHSA-vg35-5wq7-3x7w # tinymce: XSS via media plugin (fixed 7.9.3)
    - GHSA-q742-qvgc-gc2f # tinymce: XSS via data-mce attributes (fixed 7.9.3)
    - GHSA-v98h-vmpc-fpqv # tinymce: XSS via mce:protected comments (fixed 7.9.3)
