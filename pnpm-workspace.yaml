  nx: 23.3.0
  '@nx/js': 23.3.0
  '@nx/nest': 23.3.0
  '@nx/vite': 23.3.0
  '@nx/vitest': 23.3.0
  '@nx/eslint': 23.3.0
  '@nx/playwright': 23.3.0
  typescript: 5.9.3
  '@types/node': 22.13.14
  vitest: 3.2.4
  '@vitest/coverage-v8': 3.2.4
  unplugin-swc: 2.0.0
  '@swc/core': 1.16.13
  '@swc/cli': 0.7.9
  eslint: 9.39.1
  '@eslint/js': 9.39.1
  typescript-eslint: 8.46.4
  eslint-config-prettier: 10.1.8
  eslint-plugin-vue: 10.5.1
  globals: 16.5.0
  prettier: 3.6.2
  supertest: 7.1.4
  axios: 1.15.0
  get-port: 7.1.0
  knex-mock-client: 3.0.2
  '@types/supertest': 6.0.3
  # API
  '@nestjs/common': 12.1.2
  '@nestjs/core': 12.1.2
  '@nestjs/platform-express': 12.1.2
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  express: 5.2.1
  '@types/express': 5.0.3
  knex: 3.1.0
  pg: 8.16.3
  mysql2: 3.22.6 # security patch, Directus 11.17.4 has 3.15.3 (plan.md Complexity Tracking)
  sqlite3: 5.1.7
  tedious: 18.6.1
  oracledb: 6.10.0
  ioredis: 5.8.2
  keyv: 5.5.3
  '@keyv/redis': 3.0.1
  rate-limiter-flexible: 7.2.0
  lru-cache: 11.2.2
  '@sesamecare-oss/redlock': 1.4.0
  pino: 9.7.0
  pino-http: 10.5.0
  pino-http-print: 3.1.0
  pino-pretty: 13.1.2
  prom-client: 15.1.3
  cron: 4.3.4
  '@godaddy/terminus': 4.12.1
  helmet: 8.1.0
  cors: 2.8.5
  '@types/cors': 2.8.19
  cookie-parser: 1.4.7
  '@types/cookie-parser': 1.4.10
  body-parser: 1.20.3
  '@types/body-parser': 1.19.6
  qs: 6.14.2
  '@types/qs': 6.14.0
  proxy-addr: 2.0.8 # security patch, Directus 11.17.4 has 2.0.7
  '@types/proxy-addr': 2.0.3
  object-hash: 3.0.0
  '@types/object-hash': 3.0.6
  lodash-es: 4.18.1
  '@types/lodash-es': 4.17.12
  nanoid: 5.1.16 # security patch, Directus 11.17.4 has 5.1.6
  ms: 2.1.3
  '@types/ms': 2.1.0
  bytes: 3.1.2
  '@types/bytes': 3.1.5
  camelcase: 8.0.0
  dotenv: 17.2.3
  js-yaml: 4.3.2 # security patch, Directus 11.17.4 has 4.1.1
  '@types/js-yaml': 4.0.9
  fs-extra: 11.3.2
  '@types/fs-extra': 11.0.4
  '@aws-sdk/client-s3': 3.928.0
  '@aws-sdk/lib-storage': 3.928.0
  '@smithy/node-http-handler': 4.4.5
  '@shopify/semaphore': 3.1.0
  '@ngneat/falso': 8.0.2
  '@tus/utils': 0.6.0
  swagger-cli: 4.0.4
  openapi3-ts: 4.5.0
  # Web
  vue: 3.5.43 # security patch
  vite: 7.3.0
  '@vitejs/plugin-vue': 6.0.1
  pinia: 3.0.3
  vue-router: 4.6.3
  vue-i18n: 11.1.12
  '@vue/test-utils': 2.4.6
  happy-dom: 20.8.9
  '@playwright/test': 1.64.0
  vue-tsc: 3.1.3
  # Benchmark
  autocannon: 8.0.0
  hdr-histogram-js: 3.0.1
  '@types/autocannon': 7.12.7

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - nx
  - oracledb
  - sqlite3

# Security patches of transitive dependencies (plan.md Complexity Tracking).
overrides:
  fast-xml-parser@>=5.0.0 <5.5.6: 5.5.12 # via @aws-sdk/client-s3

# tar 6 comes with sqlite3 5.1.7 (same as Directus 11.17.4); only sqlite3/deps/extract.js loads it, to unpack the
# bundled SQLite source when node-gyp builds from source. Runtime code never loads it, and tar 7 would change major
# under sqlite3. Accepted in plan.md Complexity Tracking.
auditConfig:
  ignoreGhsas:
    - GHSA-34x7-hfp2-rc4v
    - GHSA-8qq5-rm4j-mr97
    - GHSA-83g3-92jg-28cx
    - GHSA-qffp-2rhf-9h96
    - GHSA-9ppj-qmqm-q256
    - GHSA-r6q2-hw4h-h46w
    - GHSA-23hp-3jrh-7fpw
    - GHSA-8x88-c5mf-7j5w
    - GHSA-r292-9mhp-454m
