<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- No static icon link (as the DR index.html): the app head is the only favicon, so the browser never
		     falls back to the default one after the loading favicon (D-173). -->
		<title>Backoffice</title>
		<style id="custom-css"></style>
	</head>
	<body>
		<div id="app"></div>
		<!-- Spec 020 (Q-44): teleport targets of extensions written for the DR app (v-dialog, v-menu). -->
		<div id="dialog-outlet"></div>
		<div id="menu-outlet"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
