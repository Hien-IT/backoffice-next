server {
	listen 8080;
	root /usr/share/nginx/html;
	# Keep the client port in redirects (container ports are usually remapped).
	absolute_redirect off;

	location = / {
		return 302 /admin/;
	}

	# Run-time config: never cached, so a new container environment is picked up on reload.
	location = /admin/config.json {
		add_header Cache-Control "no-store";
	}

	# The maplibre worker is an ES module (.mjs); nginx's mime.types has no .mjs entry and a module worker served as
	# application/octet-stream fails to load (map interface and map layout, feature 014).
	location ~ \.mjs$ {
		types {
			application/javascript mjs;
		}
	}

	# SPA: unknown paths under /admin fall back to index.html for the router.
	location /admin/ {
		try_files $uri $uri/ /admin/index.html;
	}
}
