# Feature 019 (FR-001..FR-005): /admin is served like DR serves it (directus/api/src/app.ts:263-290): the page
# (index.html, also for /admin and every unknown /admin path) is never cached, the other files are cached for a year,
# and every response carries the Content-Security-Policy DR would send (docker/csp.awk, written at start).
map $uri $bo_cache_control {
	default "";
	/admin/index.html "no-cache";
	# Run-time config: never cached, so a new container environment is picked up on reload.
	/admin/config.json "no-store";
	~^/admin/ "max-age=31536000, immutable";
}

map $uri $bo_vary {
	default "";
	~^/admin/ "Origin, Cache-Control";
}

server {
	listen 8080;
	root /usr/share/nginx/html;
	# Keep the client port in redirects (container ports are usually remapped).
	absolute_redirect off;

	include /etc/nginx/conf.d/csp.inc;
	add_header Cache-Control $bo_cache_control;
	add_header Vary $bo_vary;

	location = / {
		return 302 /admin/;
	}

	location = /admin {
		try_files /admin/index.html =404;
	}

	# The maplibre worker is an ES module (.mjs); nginx's mime.types has no .mjs entry and a module worker served as
	# application/octet-stream fails to load (map interface and map layout, feature 014).
	location ~ \.mjs$ {
		types {
			application/javascript mjs;
		}
		try_files $uri /admin/index.html;
	}

	# SPA: unknown paths under /admin fall back to index.html for the router, also those with a file extension.
	location /admin/ {
		try_files $uri $uri/ /admin/index.html;
	}
}
